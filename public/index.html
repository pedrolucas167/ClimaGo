<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaGo - Clima em Tempo Real</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/client.js"></script>
</head>
<body>
    <div id="container">
        <h1>ClimaGo</h1>
        
        <div class="input-group">
            <input type="text" id="city" placeholder="Digite o nome da cidade" onkeypress="handleKeyPress(event)">
            <button onclick="getWeather()">Buscar</button>
            <button onclick="getLocation()" class="geo-btn" title="Usar minha localização">📍</button>
        </div>
        
        <div class="auto-update-toggle">
            <label>
                <input type="checkbox" id="autoUpdate" onchange="toggleAutoUpdate()">
                Atualização automática (5 min)
            </label>
        </div>
        
        <p id="loading" class="loading" style="display: none;">Carregando...</p>
        
        <div id="weather"></div>
        
        <div id="forecast" style="display: none;"></div>
        
        <div class="recent-searches">
            <h3>Buscas Recentes</h3>
            <div id="recentSearchesList"></div>
        </div>
    </div>
</body>
</html>
